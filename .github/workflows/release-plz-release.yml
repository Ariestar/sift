name: Release-plz release

# Creates the `vX.Y.Z` tag when a Release PR is merged. With
# `release_always = false` release-plz only releases when the merged PR came
# from a `release-plz-` branch. The tag then runs release.yml (assets,
# crates.io, GitHub Release, installer smoke).

on:
  pull_request:
    types: [closed]

permissions:
  contents: write

jobs:
  release-plz:
    name: Tag release
    if: github.event.pull_request.merged == true && contains(github.event.pull_request.labels.*.name, 'release')
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          fetch-tags: true
          persist-credentials: false

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Tag release
        uses: release-plz/action@v0.5.133
        with:
          command: release
        env:
          # The tag must be pushed with a PAT (RELEASE_PLZ_TOKEN) assigned to
          # GITHUB_TOKEN, because the default GITHUB_TOKEN push does not trigger
          # other workflows (e.g. release.yml). release-plz reads the git token
          # from GITHUB_TOKEN; a separate RELEASE_PLZ_TOKEN env is not used.
          GITHUB_TOKEN: ${{ secrets.RELEASE_PLZ_TOKEN }}