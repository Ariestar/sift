<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>sivtr</title>
  <link rel="stylesheet" href="/app.css">
</head>
<body>
  <header class="topbar">
    <span class="brand">sivtr</span>
    <span class="brand-sub">unified memory</span>
    <input id="search" type="search" placeholder="Search memory  ( / )" autocomplete="off" spellcheck="false" aria-label="Search memory">
    <select id="source" aria-label="Search source">
      <option value="all">all</option>
      <option value="all:agent">agents</option>
      <option value="all:terminal">terminal</option>
    </select>
    <select id="method" aria-label="Search method">
      <option value="literal">BM25</option>
      <option value="semantic">semantic</option>
      <option value="hybrid">hybrid</option>
    </select>
  </header>
  <main class="layout">
    <aside id="sessions-pane" class="pane">
      <div class="pane-head">
        <span>Sessions</span>
        <select id="provider" aria-label="Filter sessions by provider"><option value="">all providers</option></select>
      </div>
      <ul id="sessions" class="list"></ul>
    </aside>
    <section id="content-pane" class="pane">
      <section id="usage-summary" class="usage-summary">
        <div class="pane-head"><span>Usage</span><span id="usage-updated" class="meta"></span></div>
        <div id="usage-total" class="usage-total"></div>
        <div id="usage-groups" class="usage-groups"></div>
        <div id="stats-summary" class="stats-summary"></div>
      </section>
      <div id="results-head" class="pane-head hidden"><span>Search results</span><button id="clear-search">clear</button></div>
      <ul id="results" class="list hidden"></ul>
      <div id="detail"></div>
    </section>
  </main>
  <script type="module" src="/app.js"></script>
</body>
</html>
