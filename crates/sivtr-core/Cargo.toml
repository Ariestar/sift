[package]
name = "sivtr-core"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
repository.workspace = true
description = "Core library for sivtr terminal output and AI coding session processing across local agent providers"
keywords = ["terminal", "tui", "agents", "ai"]
categories = ["command-line-utilities", "development-tools"]

[dependencies]
strip-ansi-escapes = "0.2"
unicode-width = "0.2"
regex = "1"
sha2 = "0.11"
chrono = { version = "0.4", features = ["serde"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
schemars = "1"
rusqlite = { version = "0.40", features = ["bundled", "vtab"] }
arboard = "3"
dirs = "6"
uuid = { version = "1", features = ["v4"] }
hostname = "0.4"
anyhow = "1"
rmp-serde = "1"
tempfile = "3"
toml = "1"
shell-words = "1"
ruzstd = "0.9"

[target.'cfg(windows)'.dependencies]
winapi = { version = "0.3", features = ["processenv", "winbase", "wincon", "handleapi", "processthreadsapi", "shellapi", "winuser"] }
